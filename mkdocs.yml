# The documentation as a site: `mkdocs serve`, then http://127.0.0.1:8000/pragma/
#
# The pages are the Markdown under docs/, which reads on GitHub as it is. This
# file adds the menu, the search and the theme, and nothing a page depends on:
# take it away and the documentation is still all there.
#
# What it needs is in docs/requirements.txt, and is not needed to run Pragma.
#
# It is published at the address below on every push to master that touches
# the documentation: see .github/workflows/docs.yml.

site_name: Pragma
site_description: A local agent with a memory that forgets.
site_url: https://homoagens.github.io/pragma/
repo_url: https://github.com/homoagens/pragma
repo_name: homoagens/pragma
edit_uri: ""
copyright: Copyright &copy; 2026 Homo Agens. AGPL-3.0-or-later.

docs_dir: docs
site_dir: site

# Every page has to be listed here to appear in the menu. `python docs/build.py
# --check` fails on one that is not, so a page cannot be written and then lost.
nav:
  - Home: README.md
  - Tutorial:
      - Your first project: tutorial/first-project.md
  - How-to:
      - Connect a model: how-to/connect-a-model.md
      - Use a model on another machine: how-to/use-a-model-on-another-machine.md
      - Write rules for a project: how-to/write-project-rules.md
      - Back up and restore memory: how-to/back-up-and-restore-memory.md
      - Move a project: how-to/move-a-project.md
      - Recover unfinished memory: how-to/recover-unfinished-memory.md
      - Run one task: how-to/run-one-task.md
  - Reference:
      - Commands: reference/commands.md
      - Configuration: reference/configuration.md
      - Skills: reference/skills.md
      - Prompts: reference/prompts.md
      - Files: reference/files.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Three interfaces: explanation/interfaces.md
  - Decisions: decisions/README.md

# The decision records are reached from their list, which is generated: a new
# one does not have to be added here.
not_in_nav: |
  /decisions/0*.md

# The tooling that lives beside the pages is not part of the site.
exclude_docs: |
  *.py
  __pycache__/
  requirements.txt

# Links that leave docs/ are pointed at the repository: see the file.
hooks:
  - docs/site_hooks.py
extra:
  repo_branch: master

theme:
  name: material
  language: en
  # No font is fetched from anyone: the reader's own is used.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # Nothing is fetched from anyone when a page is read. The one library the
  # theme would load from a public server - the one that draws the diagrams -
  # is downloaded when the site is built and served with it. The copy is kept
  # in .cache/, so only the first build needs the network.
  - privacy

markdown_extensions:
  - toc:
      permalink: true
  # A numbered list that starts at 3 is step 3, as on GitHub. Without this
  # every list restarts at 1 and "the folder you copied in step 3" points at
  # the wrong line.
  - sane_lists
  # The diagrams are Mermaid, as on GitHub.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# A strict build (`mkdocs build --strict`) fails on any of these.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

name: Build executables

# Builds the single-file Pragma executable for Windows, Linux and macOS.
# PyInstaller cannot cross-compile, so each OS is built on its own runner.
#
# Triggers:
#   - pushing a tag like v1.0.0
#   - manual run from the Actions tab (workflow_dispatch)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean pragma.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pragma-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

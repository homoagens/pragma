name: Build executables

# Builds the single-file Pragma executable for Windows, Linux and macOS.
# PyInstaller cannot cross-compile, so each OS is built on its own runner.
#
# Triggers:
#   - pushing a tag like v1.0.0      -> builds AND publishes a GitHub Release
#                                       with the three executables attached
#   - manual run (workflow_dispatch) -> builds, uploads artifacts only

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the Release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: pragma.exe
            asset: pragma-windows.exe
          - os: ubuntu-latest
            artifact: pragma
            asset: pragma-linux
          # Pinned (not macos-latest) so the build isn't auto-migrated to a
          # beta macOS image, and for a more compatible binary on older macs.
          - os: macos-15
            artifact: pragma
            asset: pragma-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean pragma.spec

      - name: Rename for the target OS
        run: mv dist/${{ matrix.artifact }} dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Publish to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}

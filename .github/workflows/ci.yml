name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Syntax check (all .py files)
        run: |
          find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" \
            | xargs python -m py_compile

      - name: Lint (ruff)
        run: |
          ruff check .

      # The reference pages are generated from the code. This fails when one
      # has fallen behind it, when a setting has no description, or when a
      # link in the docs points nowhere. To fix: python docs/build.py
      - name: Docs are up to date
        run: |
          python docs/build.py --check

      - name: Entry points import
        run: |
          PYTHONPATH=core:terminal:. python -c "
          import agent.chat, agent.serve, agent.batch, agent.ledger
          import pragma_launcher, pragma_home, pragma_configure, pragma_serve, pragma_jobs, pragma_brief
          print('OK: entry points import cleanly')
          "

      - name: Skill loader
        run: |
          PYTHONPATH=core:. python -c "
          from tools import ALL_SKILLS, palette
          for name in ('execute_command', 'file_outline', 'write_file', 'ask_user'):
              assert name in ALL_SKILLS, name + ' missing'
          # Memory machinery is kept importable, never offered to the agent.
          offered = palette()
          assert 'episode_consolidate' not in offered, 'episode_consolidate is offered to the agent'
          print(f'OK: {len(ALL_SKILLS)} skills loaded, {len(offered)} offered')
          "

      - name: No .env in repo
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo "ERROR: .env is tracked by git — remove it immediately"
            exit 1
          fi
          echo "OK: .env is not in repo"

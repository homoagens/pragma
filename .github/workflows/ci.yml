name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Syntax check (all .py files)
        run: |
          find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" \
            | xargs python -m py_compile

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Server imports
        run: |
          PYTHONPATH=core:. python -c "
          from agent.server import app
          print('OK: server imports cleanly')
          "

      - name: Skill loader
        run: |
          PYTHONPATH=core:. python -c "
          from skills import ALL_SKILLS, palette
          for name in ('execute_command', 'read_file', 'write_file', 'ask_user'):
              assert name in ALL_SKILLS, name + ' missing'
          # Retired skills live in core/skills/_legacy and _future: never loaded.
          for name in ('code', 'edit_file', 'llm_invoke', 'critic_validate'):
              assert name not in ALL_SKILLS, name + ' is retired but was loaded'
          # Memory machinery is kept importable, never offered to the agent.
          offered = palette()
          for name in ('episode_consolidate', 'session_reflect', 'recall_episodes', 'recall_learnings'):
              assert name not in offered, name + ' is offered to the agent'
          print(f'OK: {len(ALL_SKILLS)} skills loaded, {len(offered)} offered')
          "

      - name: No .env in repo
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo "ERROR: .env is tracked by git — remove it immediately"
            exit 1
          fi
          echo "OK: .env is not in repo"

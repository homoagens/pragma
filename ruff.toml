[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long — not enforced
    "E402",   # module-level import not at top — intentional in server.py (path setup)
    "E701",   # multiple statements on one line — intentional compact style for try/except
]
exclude = ["venv", ".git", "core/skills/_template"]

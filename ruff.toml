[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long — not enforced
    "E402",   # module-level import not at top — intentional where a script sets up its path
    "E701",   # multiple statements on one line — intentional compact style for try/except
]
exclude = ["venv", ".git", "core/tools/_template", "*/_template/*"]
